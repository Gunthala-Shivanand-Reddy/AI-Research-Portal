<!DOCTYPE html>
<html>

<head>
    <title>Reset Password - AI Research Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 380px;
        }

        .auth-card h2 {
            color: #2563eb;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #2563eb;
            outline: none;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2>🔒 Reset Password</h2>
        <p style="text-align:center; color:#6b7280;">Enter the OTP we sent to your email and your new password.</p>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <form method="POST">
            <div class="form-group">
                <label>OTP Code</label>
                <input type="text" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Enter new password" required minlength="6">
            </div>
            <button type="submit" class="btn-full">Reset Password</button>
        </form>
    </div>
</body>

</html>
