<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - AI Research Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1rem;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
        }

        .error {
            color: #fca5a5;
            font-size: 0.88rem;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 8px;
        }

        .success {
            color: #86efac;
            font-size: 0.88rem;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="logo">🔒</div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new password below.</p>
        <div id="message"></div>
        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn-full">Reset Password →</button>
        </form>
    </div>
    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        document.getElementById('resetForm').onsubmit = function (e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            fetch('/auth/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken, password: password })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('message').innerHTML = '<div class="success">✅ Password reset! Redirecting to login...</div>';
                        setTimeout(() => window.location.href = '/login', 2000);
                    } else {
                        document.getElementById('message').innerHTML = '<div class="error">❌ ' + data.error + '</div>';
                    }
                });
        };
    </script>
</body>

</html>
