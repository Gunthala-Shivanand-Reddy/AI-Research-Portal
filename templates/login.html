<!DOCTYPE html>
<html>

<head>
    <title>Login - AI Research Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 380px;
        }

        .auth-card h2 {
            color: #2563eb;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #2563eb;
            outline: none;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-full:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .link-text {
            text-align: center;
            margin-top: 15px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .link-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot a {
            color: #6b7280;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot a:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2>🧠 AI Research Portal</h2>
        <p style="text-align:center; color:#6b7280; margin-bottom: 25px;">Sign in to your account</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="forgot"><a href="/forgot-password">Forgot password?</a></div>
            <button type="submit" class="btn-full" id="loginBtn">Login</button>
        </form>

        <div class="link-text">
            Don't have an account? <a href="/signup">Sign up here</a>
        </div>
    </div>

    <script>
        // Changes the button text so users know they need to wait for the email!
        document.getElementById("loginForm").onsubmit = function () {
            var btn = document.getElementById("loginBtn");
            btn.innerHTML = "Logging in... Please wait ⏳";
            btn.style.opacity = "0.7";
        };
    </script>
</body>

</html>
