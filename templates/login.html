<!DOCTYPE html>
<html>

<head>
    <title>Login - AI Research Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
        }

        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2 style="color: #2563eb; margin-top: 0;">Restricted Access</h2>
        <p>Please enter the access code to view the AI Research Portal.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="password" name="password" placeholder="Enter Access Code" required>
            <button type="submit" class="btn" style="width: 100%;">Unlock Portal</button>
        </form>
    </div>
</body>

</html>
