<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - AI Research Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366f1, transparent);
            top: -150px;
            left: -150px;
            opacity: 0.2;
            animation: f1 18s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            bottom: -100px;
            right: -100px;
            opacity: 0.15;
            animation: f2 22s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #06b6d4, transparent);
            top: 50%;
            left: 50%;
            opacity: 0.1;
            animation: f3 15s ease-in-out infinite;
        }

        @keyframes f1 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(50px, 40px)
            }
        }

        @keyframes f2 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-50px, -40px)
            }
        }

        @keyframes f3 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-30px, 30px)
            }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 40px;
            border-radius: 20px;
            width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #818cf8, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1rem;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #64748b;
            font-size: 0.82rem;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot a:hover {
            color: #818cf8;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 18px;
            text-align: center;
        }

        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.88rem;
        }

        .link-text a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }

        .link-text a:hover {
            color: #a78bfa;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="auth-card">
        <div class="logo">🧠</div>
        <h2>AI Research Portal</h2>
        <p class="subtitle">Sign in to your account</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="forgot"><a href="/forgot-password">Forgot password?</a></div>
            <button type="submit" class="btn-full" id="loginBtn">Sign In →</button>
        </form>

        <div class="divider"></div>
        <div class="link-text">Don't have an account? <a href="/signup">Sign up here</a></div>
    </div>

    <script>
        document.getElementById("loginForm").onsubmit = function () {
            var btn = document.getElementById("loginBtn");
            btn.innerHTML = "Signing in... ⏳";
            btn.style.opacity = "0.7";
        };
    </script>
</body>

</html>
