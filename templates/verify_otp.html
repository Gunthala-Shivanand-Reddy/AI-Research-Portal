<!DOCTYPE html>
<html>

<head>
    <title>Verify Email - AI Research Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 380px;
            text-align: center;
        }

        .auth-card h2 {
            color: #2563eb;
            margin-top: 0;
        }

        .otp-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 10px;
            box-sizing: border-box;
            margin: 20px 0;
        }

        .otp-input:focus {
            border-color: #2563eb;
            outline: none;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-full:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .email-highlight {
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div style="font-size: 3rem;">📧</div>
        <h2>Check Your Email!</h2>
        <p>We sent a 6-digit OTP to:<br>
            <span class="email-highlight">{{ email }}</span>
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="otp" class="otp-input" placeholder="000000" maxlength="6" required autofocus>
            <button type="submit" class="btn-full">Verify & Enter Portal</button>
        </form>
    </div>
</body>

</html>
