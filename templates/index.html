{% extends 'base.html' %}
{% block content %}
<h1>Welcome, {{ user_name }}! 👋</h1>
<p style="color: #64748b; margin-top: -20px; margin-bottom: 30px;">Today's top Generative AI & NLP Papers</p>

<div class="paper-list">
    {% for paper in papers %}
    <div class="card">
        <h3>{{ paper.title }}</h3>
        <p><strong>Authors:</strong> {{ paper.authors }}</p>
        <p><strong>Published:</strong> {{ paper.date }}</p>
        <div class="actions">
            <a href="/paper/{{ paper.id }}" class="btn">Read & AI Explain</a>
            <a href="{{ paper.pdf_url }}" target="_blank" class="btn btn-outline">Download PDF</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
