<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Floating background orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <nav>
        <h2>🧠 AI Research Portal</h2>
        <div>
            {% if session.get('logged_in') %}
            <a href="/">Research Papers</a>
            <a href="/news">AI Updates</a>
            <a href="/logout"
                style="color:#f87171;border:1px solid rgba(248,113,113,0.3);padding:6px 14px;border-radius:6px;margin-left:20px;transition:all 0.3s;">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a href="/signup">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Floating particles animation -->
    <script>
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:0;';
        document.body.insertBefore(canvas, document.body.firstChild);
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticle() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.2,
                size: Math.random() * 1.5 + 0.3,
                opacity: Math.random() * 0.35 + 0.05,
                color: ['#6366f1', '#8b5cf6', '#06b6d4', '#a855f7'][Math.floor(Math.random() * 4)]
            };
        }

        resize();
        window.addEventListener('resize', resize);
        for (let i = 0; i < 70; i++) particles.push(createParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.opacity;
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>

</html>
