<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verifying - AI Research Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h2 {
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
        }

        a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            display: none;
            margin-top: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="icon" id="icon">🧠</div>
        <h2 id="title">Verifying your email...</h2>
        <div class="spinner" id="spinner"></div>
        <p id="message">Please wait a moment.</p>
        <a href="/login" id="loginLink">Go to Login →</a>
    </div>
    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        if (accessToken) {
            fetch('/auth/verify-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('spinner').style.display = 'none';
                    if (data.success) {
                        document.getElementById('icon').innerText = '✅';
                        document.getElementById('title').innerText = 'Email Verified!';
                        document.getElementById('message').innerText = 'Welcome! Redirecting you now...';
                        setTimeout(() => window.location.href = '/', 2000);
                    } else {
                        document.getElementById('icon').innerText = '❌';
                        document.getElementById('title').innerText = 'Verification Failed';
                        document.getElementById('message').innerText = 'The link may have expired. Please sign up again.';
                        document.getElementById('loginLink').style.display = 'block';
                    }
                });
        } else {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('icon').innerText = '❌';
            document.getElementById('title').innerText = 'Invalid Link';
            document.getElementById('message').innerText = 'This link is not valid.';
            document.getElementById('loginLink').style.display = 'block';
        }
    </script>
</body>

</html>
